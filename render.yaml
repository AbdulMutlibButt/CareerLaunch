services:
  - type: web
    name: careerlaunch-api
    runtime: node
    autoDeployTrigger: "off"
    buildCommand: npm ci --omit=dev --workspace server
    startCommand: npm run start --workspace server
    healthCheckPath: /api/health
    buildFilter:
      paths:
        - "server/**"
        - package.json
        - package-lock.json
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: "0.0.0.0"
      - key: PORT
        value: "10000"
      - key: APP_ORIGIN
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
